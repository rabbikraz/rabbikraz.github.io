    <style>
        :root {
            /* Elegant Color Palette */
            --primary: #0f172a;       /* Deep Slate / Midnight */
            --secondary: #1e293b;     /* Lighter Slate */
            --accent: #d4af37;        /* Metallic Gold */
            --accent-hover: #b5952f;  /* Darker Gold */
            --bg-light: #fdfbf7;      /* Warm Off-White */
            --card-bg: #ffffff;       /* Pure White */
            --text-main: #334155;     /* Soft Dark Grey for readability */
            --text-muted: #64748b;
            
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.08);
            --shadow-gold: 0 10px 25px rgba(212, 175, 55, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-light);
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER --- */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--card-bg);
            text-align: center;
            padding: 5rem 1.5rem 4rem;
            position: relative;
            border-bottom: 4px solid var(--accent);
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 600;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.2;
            animation: fadeInDown 0.8s ease-out;
        }

        header p {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 1rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        /* --- SPONSOR BUTTON --- */
        .top-sponsor {
            margin-top: 2rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .top-sponsor-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 2rem;
            background: var(--accent);
            color: var(--card-bg);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-gold);
            border: 1px solid var(--accent);
        }

        .top-sponsor-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.4);
        }

        /* --- LISTEN SECTION --- */
        .listen-section {
            padding: 5rem 1.5rem;
            background: var(--bg-light);
            text-align: center;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: var(--accent);
        }

        .listen-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .listen-icons a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--primary);
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease, transform 0.3s ease;
            gap: 0.75rem;
        }

        .listen-icons a:hover {
            transform: translateY(-6px);
        }

        .listen-icons .icon-wrapper {
            width: 75px;
            height: 75px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: currentColor;
            font-size: 2rem;
            border: 1px solid rgba(0,0,0,0.03);
            overflow: hidden;
        }

        .listen-icons .icon-wrapper svg {
            width: 34px;
            height: 34px;
            fill: currentColor;
        }

        /* Adjusting for 24Six tall aspect ratio */
        .listen-icons .icon-wrapper .tall-svg {
            width: auto;
            height: 36px;
        }

        .listen-icons a:hover .icon-wrapper {
            box-shadow: var(--shadow-gold);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* --- PDF SECTION --- */
        .pdf-section {
            padding: 4rem 1.5rem;
            background: var(--card-bg);
            text-align: center;
            border-top: 1px solid rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .pdf-wrapper {
            max-width: 900px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(0,0,0,0.08);
            background: var(--bg-light);
        }

        .pdf-wrapper iframe {
            width: 100%;
            height: 900px;
            border: none;
            display: block;
        }

        /* --- BOTTOM BUTTONS --- */
        .bottom-buttons {
            padding: 5rem 1.5rem;
            background: var(--bg-light);
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.25rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: var(--card-bg);
            color: var(--primary);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.06);
        }

        .btn i { font-size: 1.2rem; }

        .btn:hover {
            background: var(--primary);
            color: var(--card-bg);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
            border-color: var(--primary);
        }

        .btn.btn-gold {
            background: var(--accent);
            color: var(--card-bg);
            border-color: var(--accent);
        }

        .btn.btn-gold:hover {
            background: var(--accent-hover);
            box-shadow: var(--shadow-gold);
            border-color: var(--accent-hover);
        }

        /* --- FOOTER --- */
        footer {
            background: var(--primary);
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            padding: 3rem 1.5rem;
            font-size: 0.9rem;
        }

        /* --- ANIMATIONS & MEDIA QUERIES --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            header { padding: 3rem 1rem 2.5rem; }
            .listen-section, .bottom-buttons { padding: 2.5rem 1rem; }
            .pdf-section { padding: 2rem 1rem; }
            
            header h1 { font-size: 2rem; }
            header p { font-size: 0.9rem; letter-spacing: 2px; }
            .top-sponsor-btn { font-size: 1rem; padding: 0.6rem 1.5rem; }
            .section-title { font-size: 1.9rem; margin-bottom: 2rem; }

            .listen-icons { gap: 1rem; }
            .listen-icons a { font-size: 0.8rem; gap: 0.5rem; }
            .listen-icons .icon-wrapper { width: 60px; height: 60px; font-size: 1.6rem; }
            .listen-icons .icon-wrapper svg { width: 26px; height: 26px; }
            .listen-icons .icon-wrapper .tall-svg { height: 28px; width: auto; }
            
            .pdf-wrapper iframe { height: 70vh; }
            
            .bottom-buttons { gap: 0.75rem; }
            .btn { width: 100%; max-width: 320px; justify-content: center; padding: 0.8rem 1.5rem; font-size: 1rem; }
        }
    </style>
</head>
