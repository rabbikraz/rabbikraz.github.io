<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Maharam of Rottenburg is captured! Let's release him! — Rabbi Kraz's Shiurim</title>
    
    <meta property="og:title" content="The Maharam of Rottenburg is captured! Let's release him! — Rabbi Kraz's Shiurim">
    <meta property="og:description" content="Source sheet and video for this shiur by Rabbi Kraz">
    <meta property="og:image" content="https://github.com/rabbikraz/rabbikraz.github.io/raw/Master/Default%20Thumb.jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://rabbikraz.com/">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Elegant Color Palette */
            --primary: #0f172a;       /* Deep Slate / Midnight */
            --secondary: #1e293b;     /* Lighter Slate */
            --accent: #d4af37;        /* Metallic Gold */
            --accent-hover: #b5952f;  /* Darker Gold */
            --bg-light: #fdfbf7;      /* Warm Off-White */
            --card-bg: #ffffff;       /* Pure White */
            --text-main: #334155;     /* Soft Dark Grey for readability */
            --text-muted: #64748b;
            
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.08);
            --shadow-gold: 0 10px 25px rgba(212, 175, 55, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-light);
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER --- */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--card-bg);
            text-align: center;
            padding: 5rem 1.5rem 4rem;
            position: relative;
            border-bottom: 4px solid var(--accent);
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 600;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            animation: fadeInDown 0.8s ease-out;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.2;
        }

        header p {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
            margin-top: 1rem;
        }

        /* --- VIDEO SECTION --- */
        .video-section {
            padding: 5rem 1.5rem;
            background: var(--bg-light);
            text-align: center;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: var(--accent);
        }

        /* Collapsible Video Container */
        details.video-accordion {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.06);
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        details.video-accordion:hover {
            box-shadow: var(--shadow-lg);
        }

        details.video-accordion summary {
            padding: 1.5rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            list-style: none; /* Hides default triangle */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            background: var(--card-bg);
            transition: background 0.3s ease;
        }

        /* Hides default triangle in webkit browsers */
        details.video-accordion summary::-webkit-details-marker {
            display: none; 
        }

        details.video-accordion summary:hover {
            background: var(--bg-light);
        }

        details.video-accordion summary .fa-youtube {
            color: #ff0000; /* YouTube Red for pop */
            font-size: 2rem;
        }

        details.video-accordion summary .fa-chevron-down {
            color: var(--accent);
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        /* Flip arrow when open */
        details.video-accordion[open] summary .fa-chevron-down {
            transform: rotate(180deg);
        }

        /* Responsive YouTube Embed inside details */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border-top: 1px solid rgba(0,0,0,0.05);
            background: #000; /* Black background for video */
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- PDF SECTION --- */
        .pdf-section {
            padding: 4rem 1.5rem;
            background: var(--card-bg);
            text-align: center;
            border-top: 1px solid rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .pdf-wrapper {
            max-width: 900px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(0,0,0,0.08);
            background: var(--bg-light);
        }

        .pdf-wrapper iframe {
            width: 100%;
            height: 900px;
            border: none;
            display: block;
        }

        /* --- BOTTOM BUTTONS --- */
        .bottom-buttons {
            padding: 5rem 1.5rem;
            background: var(--bg-light);
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.25rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: var(--card-bg);
            color: var(--primary);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.06);
        }

        .btn i { font-size: 1.2rem; }

        .btn:hover {
            background: var(--primary);
            color: var(--card-bg);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
            border-color: var(--primary);
        }

        .btn.btn-gold {
            background: var(--accent);
            color: var(--card-bg);
            border-color: var(--accent);
        }

        .btn.btn-gold:hover {
            background: var(--accent-hover);
            box-shadow: var(--shadow-gold);
            border-color: var(--accent-hover);
        }

        /* --- FOOTER --- */
        footer {
            background: var(--primary);
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            padding: 3rem 1.5rem;
            font-size: 0.9rem;
        }

        /* --- ANIMATIONS & MEDIA QUERIES --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            /* General Tightening on Mobile */
            header { padding: 3rem 1rem 2.5rem; }
            .video-section, .bottom-buttons { padding: 2.5rem 1rem; }
            .pdf-section { padding: 2rem 1rem; }
            
            header h1 { font-size: 2rem; }
            header p { font-size: 0.9rem; letter-spacing: 2px; }
            .section-title { font-size: 1.9rem; margin-bottom: 2rem; }
            
            /* Accordion Mobile Adjustments */
            details.video-accordion summary { padding: 1.2rem 1rem; font-size: 1.4rem; gap: 0.75rem; }
            details.video-accordion summary .fa-youtube { font-size: 1.6rem; }

            /* PDF Tighter View on Mobile */
            .pdf-wrapper iframe { height: 70vh; }
            
            /* Button Tightening */
            .bottom-buttons { gap: 0.75rem; }
            .btn { width: 100%; max-width: 320px; justify-content: center; padding: 0.8rem 1.5rem; font-size: 1rem; }
        }
    </style>
</head>
<body>

        </details>

    <div class="bottom-buttons">

        <a href="https://rabbikraz.com/sponsor" class="btn btn-gold"><i class="fas fa-gift"></i> Sponsor a Shiur</a>
    </div>

    <footer>
        <p>© 2025 Rabbi Kraz's Shiurim. All rights reserved.</p>
    </footer>

</body>
</html>
